name: Build macOS AU

on:
  push:
    branches: [ tone3000-browser ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: |
          brew update
          brew install cmake ninja pkg-config || true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_AU=ON -DBUILD_VST3=OFF -DBUILD_VST2=OFF -DBUILD_LV2=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Ad-hoc code sign AU
        run: |
          find build -name "*.component" -maxdepth 4 -print0 | while IFS= read -r -d '' comp; do
            codesign --force --deep -s - "$comp" || true
          done

      - name: Package AU
        run: |
          mkdir -p out
          find build -name "*.component" -maxdepth 4 -exec cp -R {} out/ \;
          (cd out && zip -r NAM-AU-macos.zip *.component)

      - name: Upload AU artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAM-AU-macos
          path: out/NAM-AU-macos.zip
