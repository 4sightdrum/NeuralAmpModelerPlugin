name: Build macOS AU

on:
  push:
    branches: [ tone3000-browser ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja || true
      - name: Configure CMake
        run: |
          cmake -B build -G Xcode
      - name: Build AU
        run: |
          cmake --build build --config Release --target install
      - name: Package AU component
        run: |
          mkdir -p dist
          find build -type d -name "*.component" -print -exec cp -R {} dist \;
      - name: Upload AU artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuralAmpModeler_AU
          path: dist
          if-no-files-found: error
