name: Build macOS AU

on:
  push:
    branches: [ tone3000-browser ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build & patch Tone3000Hellbox
        run: |
          bash <<'FIXHELLBOX_ALL'
          set -euo pipefail
          cd "$HOME/Tone3000Hellbox"

          # Apply patches
          sed -i '' 's/\*bp\.state=\*c;/bp.coefficients = c;/' Source/FX_Wah.h || true
          sed -i '' '/^#include "HellboxAssets.h"/d' Source/PluginEditor.cpp || true
          if [ -f Source/Tone3000API.cpp ]; then
            sed -i '' \
              's|std::unique_ptr<juce::InputStream>(url\.createInputStream())|url.createInputStream(juce::URL::InputStreamOptions().withConnectionTimeoutMs(15000).withNumRedirectsToFollow(8))|g' \
              Source/Tone3000API.cpp
            sed -i '' \
              's|url\.createInputStream()|url.createInputStream(juce::URL::InputStreamOptions().withConnectionTimeoutMs(15000).withNumRedirectsToFollow(8))|g' \
              Source/Tone3000API.cpp
          fi
          perl -0777 -pe 's/juce::Font\\(\\s*([0-9]+(?:\\.[0-9]+)?f)\\s*\\)/juce::Font(juce::FontOptions().withHeight(\\1))/g' -i '' Source/PluginEditor.cpp 2>/dev/null || true
          perl -0777 -pe 's/juce::Font\\(\\s*([0-9]+(?:\\.[0-9]+)?f)\\s*\\)/juce::Font(juce::FontOptions().withHeight(\\1))/g' -i '' Source/ToneBrowserPanel.cpp 2>/dev/null || true

          # Build and install
          cmake --build build/xcode --config Release --target install

          # Code-sign the AU and app
          AU="/Library/Audio/Plug-Ins/Components/Tone3000: Hellbox.component"
          APP="$HOME/Tone3000Hellbox/build/xcode/Tone3000Hellbox_artefacts/Release/Standalone/Tone3000: Hellbox.app"
          [ -d "$AU" ] && sudo codesign --force --sign - --timestamp=none "$AU" || true
          [ -d "$APP" ] && codesign --force --sign - --timestamp=none "$APP" || true

          # Refresh AU cache
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          FIXHELLBOX_ALL

      - name: Package AU
        run: |
          mkdir -p out
          find /Library/Audio/Plug-Ins/Components -name "*Hellbox*.component" -print -exec zip -r out/Tone3000Hellbox.zip {} \\;

      - uses: actions/upload-artifact@v4
        with:
          name: Tone3000Hellbox
          path: out/Tone3000Hellbox.zip
