name: Build macOS AU

on:
  push:
    branches: [ tone3000-browser ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode & show version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Locate Xcode project & list schemes
        run: |
          set -euo pipefail
          PROJECT=$(find NeuralAmpModeler -name "*-macOS.xcodeproj" -print -quit)
          echo "Project: $PROJECT"
          xcodebuild -list -project "$PROJECT"

      - name: Build AU (Release, no codesign)
        run: |
          set -euo pipefail
          PROJECT=$(find NeuralAmpModeler -name "*-macOS.xcodeproj" -print -quit)
          SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | grep -E 'AUV2|AUV3|AU' | head -n1 | xargs)
          echo "Using scheme: $SCHEME"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package AU as zip
        run: |
          mkdir -p out
          COMPONENT=$(find build/DerivedData -name "*.component" -print -quit)
          echo "Found component: $COMPONENT"
          zip -r out/Tone3000-NAM-AU.zip "$COMPONENT"

      - name: Upload AU artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tone3000-NAM-AU
          path: out/Tone3000-NAM-AU.zip
