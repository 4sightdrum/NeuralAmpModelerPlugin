name: Build macOS AU

on:
  push:
    branches: [ tone3000-browser ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Xcode & list version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build AU
        run: |
          PROJECT=$(find NeuralAmpModeler -name "*-macOS.xcodeproj" -print -quit)
          SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' \
                  | grep -E 'AUV2|AUV3|AU' | head -n1 | xargs)
          xcodebuild -project "$PROJECT" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -derivedDataPath build/DerivedData \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package AU component
        run: |
          mkdir -p out
          COMPONENT=$(find build/DerivedData -name "*.component" -print -quit)
          zip -r out/Tone3000-NAM-AU.zip "$COMPONENT"

      - name: Upload AU artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tone3000-NAM-AU
          path: out/Tone3000-NAM-AU.zip
